events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate Limiting Zone for Rail Arbitration APIs
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway Routing to FastAPI Arbitration Microservices
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Support Server-Sent Events (SSE) streaming for OR-Tools live telemetry
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        # Swagger Docs Gateway
        location /docs {
            proxy_pass http://backend_upstream/docs;
        }

        location /openapi.json {
            proxy_pass http://backend_upstream/openapi.json;
        }

        # Frontend Cockpit UI
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
